name: Second Brain Dashboard CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: hearth

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: hearth/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run typecheck
            - run: npm run build
